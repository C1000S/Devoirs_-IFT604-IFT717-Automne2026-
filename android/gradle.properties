# ---------------------------------------------------------------------------
# URL de l'API RépareCampus (TP1a) — SEUL endroit à modifier.
#   Appareil USB (recommandé) : http://localhost:3000/
#       + exécuter une fois branché : adb reverse tcp:3000 tcp:3000
#       (le trafic passe par le câble : ni IP, ni pare-feu macOS à configurer)
#   Appareil en Wi-Fi         : http://<IP locale du Mac>:3000/  (ipconfig getifaddr en0)
#   Émulateur Android         : http://10.0.2.2:3000/   (10.0.2.2 = localhost du Mac)
# Surcharge ponctuelle sans modifier ce fichier :
#   ./gradlew installDebug -PapiBaseUrl=http://10.0.2.2:3000/
# ---------------------------------------------------------------------------
apiBaseUrl=http://localhost:3000/
